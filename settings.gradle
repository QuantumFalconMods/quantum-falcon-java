pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'quantumfalcon'

// CustomPortalAPI Reforged (local clone for portal integration)
def cpaPath = new File(settingsDir, '../customportalapi-reforged')
if (cpaPath.exists()) {
    includeBuild cpaPath
}
