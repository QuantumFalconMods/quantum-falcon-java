modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/QuantumFalconMods/quantum-falcon-java/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
updateJSONURL = ""
displayURL = "https://github.com/QuantumFalconMods/quantum-falcon-java"
logoFile = "logo.png"
credits = "GeckoLib team for animation support"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cpapireforged"
type = "required"
versionRange = "[1.2.2,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "quantumfalcon.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

# GeckoLib is a hard runtime requirement (all entities and renderers use it)
[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[4.7,)"
ordering = "AFTER"
side = "BOTH"
