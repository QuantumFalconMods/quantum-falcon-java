# Project properties
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod properties
mod_id=quantumfalcon
mod_name=Quantum Falcon
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.matt.quantumfalcon
mod_authors=Matt

# Minecraft/NeoForge versions (Stable 1.21.1)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
